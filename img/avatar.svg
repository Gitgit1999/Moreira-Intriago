            <stop offset="0%" stop-color="#173d38"/>
            <stop offset="100%" stop-color="#2e5b53"/>
        </linearGradient>
    </defs>

    <!-- Fondo -->
    <rect width="360" height="420" rx="28" fill="url(#fondo)"/>

    <!-- Marco decorativo -->
    <rect x="18" y="18" width="324" height="384" rx="20"
          fill="none" stroke="#b99660" stroke-width="3"/>

    <!-- Gorra policial -->
    <rect x="115" y="78" width="130" height="22" rx="8" fill="#0f223f"/>
    <path d="M105 100 Q180 55 255 100 L245 118 L115 118 Z" fill="#162b4a"/>
    <circle cx="180" cy="99" r="10" fill="#d4af37"/>
    <text x="180" y="103" text-anchor="middle"
          font-family="Times New Roman" font-size="10"
          fill="#173d38">★</text>

    <!-- Cabeza -->
    <circle cx="180" cy="155" r="48" fill="#e6cda3"/>

    <!-- Cuello -->
    <rect x="165" y="195" width="30" height="24" rx="8" fill="#d9bc93"/>

    <!-- Uniforme policial -->
    <path d="M92 315
             C100 245 132 220 180 220
             C228 220 260 245 268 315
             L268 350
             L92 350 Z"
